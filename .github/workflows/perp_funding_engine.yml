name: Perp Funding Delta Engine

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: perp-funding-compile
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/perp_funding.db
          key: perp-funding-db-${{ github.run_id }}
          restore-keys: |
            perp-funding-db-

      - name: Execute Perp Funding Engine
        run: python perp_engine.py

      - name: Commit and push permanent historical ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          # 1. Register union merge driver for append-only JSONL files
          mkdir -p .git/info
          echo "*.jsonl merge=union" >> .git/info/attributes
          echo "data/history/**/*.jsonl merge=union" >> .git/info/attributes

          # 2. Check for changes
          git add data/history/
          if git diff --staged --quiet; then
            echo "No funding rate shifts detected."
            exit 0
          fi

          # 3. Commit locally
          git commit -m "chore(history): record perpetual funding rate drift [skip ci]"

          # 4. Pull and push with retry loop
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i to sync with origin/main..."
            if git pull --rebase origin main; then
              # Deduplicate lines in today's JSONL file if union merge doubled any records
              TODAY_JSONL="data/history/$(date -u +'%Y/%m/%Y-%m-%d.jsonl')"
              if [ -f "$TODAY_JSONL" ]; then
                awk '!seen[$0]++' "$TODAY_JSONL" > "${TODAY_JSONL}.tmp" && mv "${TODAY_JSONL}.tmp" "$TODAY_JSONL"
                git add "$TODAY_JSONL"
                git commit --amend --no-edit || true
              fi

              if git push origin main; then
                echo "Successfully synchronized historical ledger."
                break
              fi
            else
              echo "Rebase conflict detected, aborting and retrying..."
              git rebase --abort || true
              git fetch origin main
              git rebase -X theirs origin/main || true
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Failed to push after $MAX_RETRIES attempts."
              exit 1
            fi
            sleep 2
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
